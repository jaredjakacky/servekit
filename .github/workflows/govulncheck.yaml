name: Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

concurrency:
  group: vuln-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          # renovate: datasource=custom.go-supported-floor depName=go-floor versioning=semver-coerced
          - '1.26.x'
          # renovate: datasource=custom.go-supported-latest depName=go-latest versioning=semver-coerced
          - '1.27.x'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Run govulncheck
        run: make govulncheck

  required-vulnerability-scan:
    name: Required Vulnerability Scan
    if: ${{ always() }}
    needs: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful vulnerability scans
        shell: bash
        env:
          GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
        run: |
          set -euo pipefail

          if [[ "$GOVULNCHECK_RESULT" != "success" ]]; then
            printf 'govulncheck=%s\n' "$GOVULNCHECK_RESULT"
            exit 1
          fi
